name: benchmark-diff

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_ref:
        description: "Base git ref for comparison (branch, tag, or SHA)"
        required: false
        default: "origin/main"

jobs:
  benchmark-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      TRANSFORMERS_NO_ADVISORY_WARNINGS: "1"
    steps:
      - name: Checkout head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev,rerank]

      - name: Resolve base ref
        id: refs
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_REF="${{ github.event.pull_request.base.sha }}"
          else
            BASE_REF="${{ inputs.base_ref }}"
          fi
          echo "base_ref=${BASE_REF}" >> "${GITHUB_OUTPUT}"
          echo "head_ref=${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Run benchmark for head (no-rerank + rerank)
        run: |
          python3 bench/run_benchmark.py --top-k 10 --enforce-gates \
            --metadata-dsn sqlite:///./.kb_mcp/bench_head_no_rerank.db \
            --output "${RUNNER_TEMP}/head_no_rerank.json"
          python3 bench/run_benchmark.py --top-k 10 --rerank --enforce-gates \
            --metadata-dsn sqlite:///./.kb_mcp/bench_head_with_rerank.db \
            --output "${RUNNER_TEMP}/head_with_rerank.json"

      - name: Checkout base via worktree
        run: |
          git fetch --no-tags origin "${{ steps.refs.outputs.base_ref }}" --depth=1 || true
          git worktree add /tmp/base-benchmark "${{ steps.refs.outputs.base_ref }}"

      - name: Run benchmark for base (no-rerank + rerank)
        run: |
          cd /tmp/base-benchmark
          PYTHONPATH=/tmp/base-benchmark python3 bench/run_benchmark.py --top-k 10 --enforce-gates \
            --metadata-dsn sqlite:///./.kb_mcp/bench_base_no_rerank.db \
            --output "${RUNNER_TEMP}/base_no_rerank.json"
          PYTHONPATH=/tmp/base-benchmark python3 bench/run_benchmark.py --top-k 10 --rerank --enforce-gates \
            --metadata-dsn sqlite:///./.kb_mcp/bench_base_with_rerank.db \
            --output "${RUNNER_TEMP}/base_with_rerank.json"

      - name: Compare benchmark reports
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import sys

          temp = pathlib.Path(os.environ["RUNNER_TEMP"])
          pairs = [
              ("no_rerank", temp / "base_no_rerank.json", temp / "head_no_rerank.json"),
              ("with_rerank", temp / "base_with_rerank.json", temp / "head_with_rerank.json"),
          ]

          quality_metrics = (
              "recall_at_10",
              "ndcg_at_10",
              "mrr",
              "faithfulness_proxy_citation_coverage",
          )
          latency_metric = "p95_latency_ms"
          failures: list[str] = []
          lines: list[str] = [
              "| profile | metric | base | head | delta |",
              "|---|---:|---:|---:|---:|",
          ]

          for profile, base_path, head_path in pairs:
              base = json.loads(base_path.read_text(encoding="utf-8"))
              head = json.loads(head_path.read_text(encoding="utf-8"))

              for metric in quality_metrics:
                  b = float(base.get(metric, 0.0))
                  h = float(head.get(metric, 0.0))
                  delta = h - b
                  lines.append(f"| {profile} | {metric} | {b:.4f} | {h:.4f} | {delta:+.4f} |")
                  if h + 1e-9 < b:
                      failures.append(f"{profile}:{metric} regressed ({h:.4f} < {b:.4f})")

              b_latency = float(base.get(latency_metric, 0.0))
              h_latency = float(head.get(latency_metric, 0.0))
              latency_delta = h_latency - b_latency
              lines.append(
                  f"| {profile} | {latency_metric} | {b_latency:.2f} | {h_latency:.2f} | {latency_delta:+.2f} |"
              )
              if b_latency > 0 and h_latency > b_latency * 1.2 and latency_delta > 10.0:
                  failures.append(
                      f"{profile}:{latency_metric} regressed ({h_latency:.2f}ms > {b_latency:.2f}ms * 1.2)"
                  )

              base_candidates = int(base.get("graph_signal_candidate_queries", 0))
              head_candidates = int(head.get("graph_signal_candidate_queries", 0))
              if base_candidates >= 10 and head_candidates >= 10:
                  b_graph = float(base.get("graph_nonzero_rate", 0.0))
                  h_graph = float(head.get("graph_nonzero_rate", 0.0))
                  lines.append(f"| {profile} | graph_nonzero_rate | {b_graph:.4f} | {h_graph:.4f} | {h_graph-b_graph:+.4f} |")
                  if h_graph + 1e-9 < b_graph:
                      failures.append(
                          f"{profile}:graph_nonzero_rate regressed ({h_graph:.4f} < {b_graph:.4f})"
                      )

          summary = pathlib.Path(os.environ["GITHUB_STEP_SUMMARY"])
          summary.write_text("\n".join(lines) + "\n", encoding="utf-8")
          if failures:
              print(json.dumps({"benchmark_regressions": failures}, indent=2))
              sys.exit(1)
          PY

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-reports
          path: |
            ${{ runner.temp }}/base_no_rerank.json
            ${{ runner.temp }}/base_with_rerank.json
            ${{ runner.temp }}/head_no_rerank.json
            ${{ runner.temp }}/head_with_rerank.json
