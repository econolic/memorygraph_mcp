name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  fast-check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
    env:
      PYTHONUNBUFFERED: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      TRANSFORMERS_NO_ADVISORY_WARNINGS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev,rerank]

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy kb_mcp

      - name: Pytest
        run: pytest -s -m "not docker and not benchmark and not external"

  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
      KB_JWT_SECRET: "ci-self-hosted-secret-please-rotate-1234567890"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python smoke helpers
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install smoke helper dependencies
        run: python -m pip install PyJWT httpx

      - name: Prepare self-hosted env
        run: |
          cp .env.selfhosted.example .env
          sed -i "s/^KB_JWT_SECRET=.*/KB_JWT_SECRET=${KB_JWT_SECRET}/" .env

      - name: Self-hosted smoke
        run: ./scripts/release_selfhosted_smoke.sh

