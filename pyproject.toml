[project]
name = "hybrid-kb-mcp"
version = "0.1.0"
description = "Hybrid Retrieval MCP server (vector + graph + memory)"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.12.4",
  "pydantic>=2.7",
  "qdrant-client>=1.9",
  "neo4j>=5.20",
  "orjson>=3.10",
  "httpx>=0.27",
  "tenacity>=8.2",
  "python-dotenv>=1.0",
  "PyJWT>=2.8",
  "SQLAlchemy>=2.0",
  "psycopg[binary]>=3.2",
  "prometheus-client>=0.20",
  "opentelemetry-api>=1.26",
  "opentelemetry-sdk>=1.26",
  "opentelemetry-exporter-otlp>=1.26",
]

[project.optional-dependencies]
rerank = ["sentence-transformers>=3.0"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.4",
  "mypy>=1.10",
]

[tool.ruff]
line-length = 100

target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
